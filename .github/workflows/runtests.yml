name: Run tests and build docs
on:
  push:
    branches: master
  pull_request:
    branches: master
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - name: Set up Git repository
      uses: actions/checkout@v7
    - name: Install Conda environment with miniforge
      uses: conda-incubator/setup-miniconda@v4
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python }}
        environment-file: yeadon-dev-env.yml
        activate-environment: yeadon-dev
        miniforge-version: latest
    - name: Run pytest
      shell: bash -l {0}
      run: |
        conda list
        coverage run -m pytest yeadon
    - name: Build the documentation
      shell: bash -l {0}
      run: |
        cd doc && make html
    - name: Test with mayavi installed
      shell: bash -l {0}
      # segfault on install step in py 3.13 and 3.14.
      if: ${{ matrix.python == '3.12' }}
      run: |
        conda install mayavi
        conda list
        coverage run -m pytest yeadon
    - name: Install the software
      shell: bash -l {0}
      run: |
        conda install pip
        python -m pip install .
        which yeadon
        yeadon -h
