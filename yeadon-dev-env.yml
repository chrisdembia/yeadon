name: yeadon-dev
channels:
  - conda-forge
# NOTE : The minimum versions correspond to those in Ubuntu 24.04 LTS.
dependencies:
  # required
  - numpy >=1.26.4
  - pyyaml >=6.0.1
  - setuptools >=68.1.2
  # optional
  #- mayavi >=4.8.1
  # development
  - coverage >=7.4.4
  - ipython >=8.20.0
  - numpydoc >=1.6.0
  - pytest >=7.4.4
  - sphinx >=7.2.6
  - sphinx_rtd_theme
